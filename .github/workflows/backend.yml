name: Backend checks

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "tests/**"
      - "tma/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "tma/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test_token_for_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff
        run: ruff check .

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Validate production container configuration
        run: |
          trap 'rm -f .env' EXIT
          printf 'BOT_TOKEN=%s\n' "$BOT_TOKEN" > .env
          docker compose config --quiet
          IMAGE_NAME=telegram-reminder-bot:ci
          docker build --tag "$IMAGE_NAME" .
          docker run --rm -e BOT_TOKEN=dummy "$IMAGE_NAME" ruff format --check .
          docker run --rm -e BOT_TOKEN=dummy "$IMAGE_NAME" ruff check .
          docker run --rm -e BOT_TOKEN=dummy "$IMAGE_NAME" pytest

      - name: Run tests
        run: pytest
